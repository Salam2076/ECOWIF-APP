          <div style="font-size: 2rem;">👤➕</div>
          <h3 style="font-weight: 700; font-size: 1.05rem; color: var(--primary);">${t('addOfficerModalTitle')}</h3>
          <p style="font-size: 0.75rem; color: var(--text-muted);">${t('addOfficerModalDesc')}</p>
        </div>
        <form id="addOfficerForm" onsubmit="handleAddOfficerSubmit(event)">
          <div class="form-group">
            <label class="form-label">${t('officerFullNameLabel')} *</label>
            <input type="text" id="newOffName" class="form-control" placeholder="${t('officerNamePlaceholder')}" required>
          </div>
          <div class="form-group">
            <label class="form-label">${t('pidLabel')} *</label>
            <input type="text" id="newOffPid" class="form-control" placeholder="${t('pidPlaceholder')}" required>
          </div>
          <div class="form-group">
            <label class="form-label">${t('mobileNumberLabel')} *</label>
            <input type="text" id="newOffMobile" class="form-control" placeholder="${t('mobilePlaceholder')}" required>
          </div>
          <div class="form-group">
            <label class="form-label">${t('emailAddressLabel')}</label>
            <input type="email" id="newOffEmail" class="form-control" placeholder="${t('emailPlaceholder')}">
          </div>
          <div class="form-group">
            <label class="form-label">${t('currentPostingLabel')} *</label>
            <input type="text" id="newOffPosting" class="form-control" placeholder="${t('postingPlaceholder')}" required>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <div class="form-group">
              <label class="form-label">${t('depositAmountLabel')} *</label>
              <input type="number" id="newOffAmount" class="form-control" value="200000" required>
            </div>
            <div class="form-group">
              <label class="form-label">${t('remarksStatusLabel')}</label>
              <select id="newOffRemarks" class="form-control">
                <option value="">${t('paidTag')}</option>
                <option value="1 Inst Due">${t('inst1Due')}</option>
                <option value="2 Inst Due">${t('inst2Due')}</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">${t('loginPinLabel')}</label>
            <input type="password" id="newOffPassword" class="form-control" placeholder="${t('defaultPinLast4Placeholder')}">
          </div>
          <button type="submit" class="btn btn-primary" style="margin-top: 6px;">${t('addListSyncBtn')}</button>
          <button type="button" class="btn btn-outline" style="margin-top: 8px;" onclick="closeModal()">${t('cancelBtn')}</button>
        </form>
      `);
    }

    function sortMembersByPID() {
      state.members.sort((a, b) => {
        const pidA = parseInt(a.personalId, 10) || 0;
        const pidB = parseInt(b.personalId, 10) || 0;
        return pidA - pidB;
      });
      state.members.forEach((m, idx) => m.sn = idx + 1);
    }

    function showEditOfficerModal(pid) {
      const member = state.members.find(m => m.personalId === pid);
      if (!member) return;

      showModal(`
        <div style="text-align: center; margin-bottom: 12px;">
          <div style="font-size: 2rem;">✏️👤</div>
          <h3 style="font-weight: 700; font-size: 1.05rem; color: var(--primary);">${t('editOfficerModalTitle')}</h3>
          <p style="font-size: 0.75rem; color: var(--text-muted);">${t('editOfficerModalDesc')}</p>
        </div>
        <form onsubmit="handleEditOfficerSubmit(event, '${member.personalId}')">
          <div class="form-group">
            <label class="form-label">${t('officerFullNameLabel')} *</label>
            <input type="text" id="editOffName" class="form-control" value="${(member.name || '').replace(/"/g, '&quot;')}" required placeholder="${t('officerNamePlaceholder')}">
          </div>
          <div class="form-group">
            <label class="form-label">${t('pidLabel')} *</label>
            <input type="text" id="editOffPid" class="form-control" value="${member.personalId}" required placeholder="${t('pidPlaceholder')}">
          </div>
          <div class="form-group">
            <label class="form-label">${t('mobileNumberLabel')} *</label>
            <input type="text" id="editOffMobile" class="form-control" value="${member.mobile || ''}" required placeholder="${t('mobilePlaceholder')}">
          </div>
          <div class="form-group">
            <label class="form-label">${t('emailAddressLabel')}</label>
            <input type="email" id="editOffEmail" class="form-control" value="${member.email || ''}" placeholder="${t('emailPlaceholder')}">
          </div>
          <div class="form-group">
            <label class="form-label">${t('currentPostingLabel')} *</label>
            <input type="text" id="editOffPosting" class="form-control" value="${(member.posting || '').replace(/"/g, '&quot;')}" required placeholder="${t('postingPlaceholder')}">
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <div class="form-group">
              <label class="form-label">${t('depositAmountLabel')} *</label>
              <input type="number" id="editOffAmount" class="form-control" value="${member.finalAmount || 0}" required>
            </div>
            <div class="form-group">
              <label class="form-label">${t('remarksStatusLabel')}</label>
              <select id="editOffRemarks" class="form-control">
                <option value="" ${!member.remarks || member.remarks.trim() === '' ? 'selected' : ''}>${t('paidTag')}</option>
                <option value="1 Inst Due" ${member.remarks && member.remarks.includes('1') ? 'selected' : ''}>${t('inst1Due')}</option>
                <option value="2 Inst Due" ${member.remarks && member.remarks.includes('2') ? 'selected' : ''}>${t('inst2Due')}</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">${t('loginPinLabel')}</label>
            <input type="text" id="editOffPassword" class="form-control" value="${member.password || member.personalId.slice(-4)}" placeholder="${t('defaultPinLast4Placeholder')}">
          </div>
          <div style="font-size: 0.72rem; color: #047857; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 8px; padding: 8px; margin-bottom: 12px;">
            ℹ️ <strong>Tips:</strong> ${t('editPidTip')}
          </div>
          <button type="submit" class="btn btn-primary" style="margin-top: 4px;">${t('saveSyncLiveBtn')}</button>
          <button type="button" class="btn btn-outline" style="margin-top: 8px;" onclick="closeModal()">${t('cancelBtn')}</button>
        </form>
      `);
    }

    function handleEditOfficerSubmit(e, oldPid) {
      e.preventDefault();
      const name = document.getElementById('editOffName').value.trim();
      const newPid = document.getElementById('editOffPid').value.trim();
      const mobile = document.getElementById('editOffMobile').value.trim();
      const email = document.getElementById('editOffEmail').value.trim();
      const posting = document.getElementById('editOffPosting').value.trim();
      const amount = parseInt(document.getElementById('editOffAmount').value) || 0;
      const remarks = document.getElementById('editOffRemarks').value;
      const password = document.getElementById('editOffPassword').value.trim() || newPid.slice(-4);

      if (!newPid) {
        alert('Personal ID (PID) cannot be blank!');
        return;
      }

      if (newPid !== oldPid) {
        const existing = state.members.find(m => m.personalId === newPid && m.personalId !== oldPid);
        if (existing) {
          alert(`of: this PID (${newPid}) Already Other Officer "${existing.name}"`);
          return;
        }
      }

      const member = state.members.find(m => m.personalId === oldPid);
      if (!member) return;

      member.name = name;
      member.personalId = newPid;
      member.mobile = mobile;
      member.email = email;
      member.posting = posting;
      member.finalAmount = amount;
      member.remarks = remarks;
      member.password = password;

      state.deposits.forEach(d => {
        if (d.pid === oldPid) {
          d.pid = newPid;
          d.memberName = name;
        }
      });

      member.passwordUpdatedAt = new Date().toISOString();
      if (state.currentUser && state.currentUser.personalId === oldPid) {
        state.currentUser.personalId = newPid;
        state.currentUser.name = name;
        state.currentUser.sessionPin = password;
      }

      sortMembersByPID();
      saveState();

      closeModal();
      showToast(`Officer "${name}"-its All Info Successfully update And Sync Has been!`);
      renderContent();
    }

    function handleAddOfficerSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('newOffName').value.trim();
      const pid = document.getElementById('newOffPid').value.trim();
      const mobile = document.getElementById('newOffMobile').value.trim();
      const email = document.getElementById('newOffEmail').value.trim();
      const posting = document.getElementById('newOffPosting').value.trim();
      const amount = parseInt(document.getElementById('newOffAmount').value) || 0;
      const remarks = document.getElementById('newOffRemarks').value;
      const password = document.getElementById('newOffPassword').value.trim() || pid.slice(-4);

      const existing = state.members.find(m => m.personalId === pid);
      if (existing) {
        alert(`of: this identity No. (PID: ${pid}) already has "${existing.name}" registered!`);
        return;
      }

      const newMember = {
        sn: state.members.length + 1,
        name: name,
        personalId: pid,
        mobile: mobile,
        email: email,
        posting: posting,
        depositDate: '15/11/2026',
        depositAmount: 50000,
        finalAmount: amount,
        remarks: remarks,
        password: password
      };

      state.members.push(newMember);
      sortMembersByPID();
      saveState();
      closeModal();
      showToast(`${name} (PID: ${pid}) whom Successfully PID according to In correct serial Included of Has been!`);
      renderContent();
    }

    function removeOfficer(pid) {
      const member = state.members.find(m => m.personalId === pid);
      if (!member) return;

      const confirmed = confirm(`Are you sure you want to remove "${member.name}" (PID: ${pid}) from the fund?\n\nWarning: This will be permanently deleted from the cloud database.`);
      if (confirmed) {
        state.members = state.members.filter(m => m.personalId !== pid);
        sortMembersByPID();
        saveState();
        showToast(`Officer "${member.name}" has been removed!`);
        renderContent();
      }
    }

    function handleReorderMembersByPID() {
      sortMembersByPID();
      saveState();
      showToast('Members reordered by PID successfully!');
      renderContent();
    }

    function showFirebaseInfoModal() {
      const isAdmin = state.currentUser && state.currentUser.role === 'admin';
      const onlineCount = getOnlineMembersCount();

      const dbUrlHtml = isAdmin ? `

          <strong>${t('databaseUrlLabel')}:</strong><br>
          <span style="color: #0284c7; font-size: 0.72rem;">https://ecowif-app-default-rtdb.firebaseio.com</span>
        </div>
      ` : '';

      const loginMembersHtml = isAdmin ? `
        <div style="margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px;">
          <div>
            <div style="font-weight: 700; color: #064e3b; font-size: 0.8rem;">${t('loginMembersNow')}</div>
            <div style="font-size: 0.72rem; color: #059669; font-weight: 600;">
              <span style="display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #10b981; margin-right: 4px;"></span>
              <span id="onlineMembersCountSpan">${formatNumberLang(onlineCount)} ${t('onlineBadge')}</span> / ${formatNumberLang(state.members.length)} ${t('totalCountOfficers')}
            </div>
          </div>
          <button type="button" class="btn btn-sm btn-primary" onclick="closeModal(); showMemberListPopup('total');" style="width: auto; padding: 4px 10px; font-size: 0.75rem; border-radius: 6px; cursor: pointer;">
            ${t('viewMembersBtn')}
          </button>
        </div>
      ` : '';

      showModal(`
        <div style="text-align: center; margin-bottom: 12px;">
          <div style="font-size: 2rem;">⚡🔥</div>
          <h3 style="font-weight: 700; font-size: 1.05rem; color: var(--primary);">${t('firebaseTitle')}</h3>
          <p style="font-size: 0.75rem; color: var(--text-muted);">${t('firebaseSubtitle')}</p>
        </div>
        <div style="background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 12px; font-size: 0.8rem; margin-bottom: 12px;">
          <div><strong>${t('connectionStatus')}:</strong> ${state.isLiveSync ? `<span style="color: #059669; font-weight:700;">${t('liveSync')}</span>` : `<span style="color: #dc2626; font-weight:700;">○ ${t('offline')}</span>`}</div>
          ${dbUrlHtml}
          <div style="margin-top: 5px;"><strong>${t('totalMembersCount')}:</strong> ${formatNumberLang(state.members.length)} ${t('officers')}</div>
          ${loginMembersHtml}
        </div>
        <button type="button" class="btn btn-primary" onclick="closeModal()">${t('okBtn')}</button>
      `);
    }

    function showModal(contentHtml) {
      document.getElementById('modalContainer').innerHTML = `
        <div class="modal-overlay" onclick="if(event.target === this) closeModal()">
          <div class="modal-card">${contentHtml}</div>
        </div>
      `;
    }

    function closeModal() {
      pendingRejectDepositId = null;
      document.getElementById('modalContainer').innerHTML = '';
    }

    // Virtual keyboard detection & dynamic .app-shell height adjustment
    (function setupKeyboardViewportHandler() {
      const appShell = document.querySelector('.app-shell');
      if (!appShell) return;

      let lastWidth = window.innerWidth;
      let baseHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;

      function isTextInput(el) {
        if (!el) return false;
        const tag = el.tagName;
        if (tag === 'TEXTAREA' || tag === 'SELECT') return true;
        if (tag === 'INPUT') {
          const t = (el.type || 'text').toLowerCase();
          return !['button', 'submit', 'reset', 'checkbox', 'radio', 'file', 'hidden'].includes(t);
        }
        return false;
      }

      function syncViewportHeight() {
        const currentWidth = window.innerWidth;
        const currentHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;

        if (Math.abs(currentWidth - lastWidth) > 2) {
          lastWidth = currentWidth;
          baseHeight = currentHeight;
        } else if (currentHeight > baseHeight) {
          baseHeight = currentHeight;
        }

        document.documentElement.style.setProperty('--app-height', `${Math.round(currentHeight)}px`);

        const heightDrop = baseHeight - currentHeight;
        const keyboardVisible = heightDrop > 110 || (isTextInput(document.activeElement) && heightDrop > 40);
        appShell.classList.toggle('keyboard-open', keyboardVisible);

        if (keyboardVisible && isTextInput(document.activeElement)) {
          requestAnimationFrame(() => {
            document.activeElement.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          });
        }
      }

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncViewportHeight);
      }
      window.addEventListener('resize', syncViewportHeight);
      document.addEventListener('focusin', () => setTimeout(syncViewportHeight, 80));
      document.addEventListener('focusout', () => setTimeout(syncViewportHeight, 80));
      syncViewportHeight();
    })();

    // App start & live connection
    updateLanguageSwitchUI();
    renderContent();
    syncWeeklyPendingDepositReminder({ allowInAppToast: true, deferMs: 1200 });
    initFirebase();

    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js')
          .then(function(registration) {
            console.log('ECOWIF Service Worker registered successfully:', registration.scope);
          })
          .catch(function(error) {
            console.warn('ECOWIF Service Worker registration failed:', error);
          });
      });
    }
  </script>
